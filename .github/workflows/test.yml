name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ecidadao-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.5"
          otp-version: "29"
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix test
      - run: bash -n deploy/deploy.sh
      - run: python3 -m py_compile scripts/smoke.py
      - run: python3 -m unittest discover -s test -p "*_test.py"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/requirements-ci.txt
      - name: Public MCP contract through official SDK
        run: python scripts/check_mcp_local.py
      - name: Preserve MCP contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-contract
          path: |
            mcp-report.json
            mcp-server.log
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ecidadao.pt
    timeout-minutes: 25
    steps:
      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ecidadao_deploy
          chmod 600 ~/.ssh/ecidadao_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy tested commit and verify website and MCP
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -i ~/.ssh/ecidadao_deploy "ecidadao-deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA"
  production-contract:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/requirements-ci.txt
      - run: python scripts/smoke.py https://ecidadao.pt --revision "$GITHUB_SHA" --municipal --locales --sns24 --services --map
      - run: python scripts/check_mcp.py https://ecidadao.pt/mcp/public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-contract
          path: mcp-report.json
